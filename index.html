<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>Raccontaci il tuo quartiere — Fioriture Civiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --red:#E63B4B; --red-soft:#F7C9CE;
    --blue:#2F3E9E; --blue-soft:#DCE1F6;
    --cream:#F3EFE8; --paper:#FFFFFF; --ink:#1F2340; --muted:#6B7085; --line:#E4E1DA;
    --ok:#2E8B57; --radius:14px;
    --q:#2F3E9E; --nav:rgba(243,239,232,.95); --chipbg:#fff;
  }
  body.night{--cream:#14182A;--paper:#1F2340;--ink:#F3EFE8;--muted:#AEB3CC;--line:#363D60;--blue-soft:#2F3E9E;--q:#BFC9FF;--nav:rgba(20,24,42,.95);--chipbg:#262B4A}
  body{transition:background .5s}
  #view{transition:opacity .22s ease}
  #view.fading{opacity:0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.45}
  button,input,textarea,select{font:inherit;color:inherit}

  header{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .wordmark{font-weight:800;line-height:.9;font-size:22px;letter-spacing:-.5px}
  .wordmark .a{color:var(--red)}.wordmark .b{color:var(--blue)}
  .progress{flex:1;height:6px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progress i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
  .stepnum{font-size:12px;color:var(--muted);white-space:nowrap}

  main{max-width:720px;margin:0 auto;padding:16px 16px 120px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .pill b{color:var(--ink);font-weight:600}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#C9C5BD}
  .pill .dot.on{background:var(--ok)}

  .section-title{color:var(--red);font-weight:800;font-size:26px;letter-spacing:-.5px;margin:6px 0 2px;text-transform:uppercase}
  .section-sub{color:var(--muted);font-size:14px;margin:0 0 18px}

  .card{background:var(--paper);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;border:1px solid var(--line)}
  .q{font-weight:600;font-size:17px;color:var(--q);margin:0 0 4px}
  .q .code{display:inline-block;background:var(--blue-soft);color:var(--q);font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:middle}
  .hint{font-size:13px;color:var(--muted);margin:0 0 12px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--chipbg);border-radius:99px;padding:9px 14px;cursor:pointer;user-select:none;font-size:15px;transition:all .12s;max-width:100%;overflow-wrap:anywhere}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chips.radio{flex-direction:column;gap:6px}
  .chips.radio .chip{border-radius:10px;text-align:left;padding:10px 14px 10px 42px;position:relative}
  .chips.radio .chip::before{content:'';position:absolute;left:14px;top:50%;width:16px;height:16px;margin-top:-9px;border-radius:50%;border:2px solid var(--muted);background:transparent}
  .chips.radio .chip.on::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 4px var(--blue)}

  input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--chipbg);outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--blue)}
  textarea{min-height:76px;resize:vertical}
  .sub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .lbl{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 6px}
  body.night .pin{background:#262B4A}
  body.night .progress{background:var(--paper)}
  .other{margin-top:10px}

  /* intro */
  .intro{background:var(--paper);border-radius:var(--radius);padding:24px 20px;border:1px solid var(--line)}
  .intro h1{color:var(--red);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.5px;margin:0 0 14px}
  .intro p{margin:0 0 12px}
  .intro .tag{display:inline-flex;gap:6px;align-items:center;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;margin-right:6px}
  .intro .zones{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .intro .zones span{background:var(--cream);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:500}
  .consent{margin-top:16px;padding:12px 14px;background:var(--cream);border-radius:10px;font-size:13.5px;line-height:1.5}
  .consent p{margin:0 0 8px}.consent p:last-child{margin:0}
  .consent a{color:var(--blue);font-weight:600}

  /* photo */
  .photo{display:flex;gap:12px;align-items:center;margin-top:10px}
  .photo .thumb{width:72px;height:72px;border-radius:10px;background:var(--cream);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;overflow:hidden;flex:none}
  .photo .thumb img{width:100%;height:100%;object-fit:cover}
  .photo>div:last-child{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .photo label.btn{display:inline-block;line-height:1.2}
  .photo .opt{font-size:13px;color:var(--muted);line-height:1.3}

  /* map */
  .map{height:62vh;min-height:320px;border-radius:10px;border:1.5px solid var(--line);background:#EAE6DE;position:relative;overflow:hidden;z-index:0}
  .map.night{background:#161a2a;border:6px solid #1F2340;box-shadow:0 0 0 1.5px #3a4160,0 8px 24px rgba(31,35,64,.35)}
  .map.night .leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) brightness(.8) contrast(.95) saturate(.45)}
  .map.night .leaflet-control-attribution{background:rgba(22,26,42,.8);color:#aab}
  .map .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
  .maplock{position:absolute;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(31,35,64,.28);cursor:pointer}
  .maplock span{background:#fff;color:#1F2340;font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .mapunlock{position:absolute;top:10px;right:10px;z-index:500;background:#fff;color:#1F2340;border:0;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
  .mapbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;font-size:13px;color:var(--muted)}
  .pin{background:var(--cream);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;align-items:center}
  .pin .n{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;flex:none}
  .pin .t{flex:1;font-size:14px;min-width:0;overflow-wrap:anywhere}
  .pin .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px}
  .marker-icon{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--red);transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
  .marker-icon span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px}

  /* pin sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(31,35,64,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;color:#1F2340;width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px 24px;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
  .sheet .lbl{color:#1F2340}.sheet input,.sheet select{background:#fff;color:#1F2340;border-color:#E4E1DA}
  .sheet .btn.ghost{background:#fff;color:#6B7085;border-color:#E4E1DA}
  .sheet h3{margin:0 0 4px;color:var(--blue);font-size:17px}
  .sheet .coords{font-size:12px;color:var(--muted);margin:0 0 12px}
  .sheet .actions{display:flex;gap:10px;margin-top:14px}
  .sheet .actions .btn{flex:1;text-align:center}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:20}
  nav .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center}
  .btn{border:1.5px solid var(--blue);background:var(--chipbg);color:var(--q);border-radius:99px;padding:11px 20px;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;flex:1}
  .btn.ghost{border-color:var(--line);color:var(--muted)}
  .btn:disabled{opacity:.4;cursor:default}
  .spacer{flex:1}
  .hidden{display:none!important}
  .timer{font-variant-numeric:tabular-nums}
  pre{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:50vh}
  .done{font-size:40px;text-align:center;margin:10px 0}
  @media (min-width:600px){ .map{height:60vh} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="wordmark"><span class="a">fioriture</span><br><span class="b">civiche</span></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="stepnum" id="stepnum"></div>
  </div>
</header>

<main>
  <div class="meta hidden" id="meta">
    <span class="pill"><span class="dot" id="gpsdot"></span>GPS <b id="gps">in attesa…</b></span>
    <span class="pill">🕒 <b id="clock">—</b></span>
    <b class="timer hidden" id="timer">00:00</b>
  </div>
  <div id="view"></div>
</main>

<nav><div class="in">
  <button class="btn ghost" id="back">Indietro</button>
  <span class="spacer"></span>
  <button class="btn primary" id="next">Avanti</button>
</div></nav>

<script>
/* ---------- schema ---------- */
const LUOGHI=['strada','piazza','giardino / parco','fermata','davanti a scuola','centro commerciale / bar','altro'];
const S = [
 { id:'intro', title:'', sub:'', items:[{t:'intro'}]},
 { id:'A', title:'A · Qui, adesso', sub:'Le prime domande riguardano il posto in cui ti trovi adesso.',
   items:[
    {k:'A1', code:'A1', t:'textphoto', q:'Guardati intorno: se dovessi descrivere questo posto a qualcuno/a, cosa gli/le diresti?', hint:'Raccontacelo con qualche parola e, se ti va, scatta una foto.'},
    {k:'A2', code:'A2', t:'single', q:'Quanto spesso vieni qui?', opts:['quasi ogni giorno','qualche volta a settimana','ogni tanto','è la prima volta o quasi']},
    {k:'A3', code:'A3', t:'textphoto', q:'Se potessi cambiare una cosa di questo posto, da domani, cosa sarebbe?', hint:'Raccontacelo con qualche parola e, se ti va, scatta una foto.'},
   ]},
 { id:'B', title:'B · Nella tua zona', sub:'“Zona” = circa 20–30 minuti a piedi da qui.',
   items:[
    {k:'B1', code:'B1', t:'map', q:'A circa 20–30 minuti a piedi da qui, ci sono altri posti dove vai spesso?', hint:'Attiva la mappa, poi tocca un punto per aggiungere un luogo.', sheet:{title:'Un posto dove vai spesso', fields:[{k:'tipo',lbl:'Che luogo è',t:'select',opts:LUOGHI},{k:'perche',lbl:'Perché ti piace andarci',t:'text'}]}},
   ]},
 { id:'C', title:'C · Nelle ore serali', sub:'Pensa adesso alla tua esperienza in questa zona nelle ore serali…',
   items:[
    {k:'C1', code:'C1', t:'single', q:'Ti capita di stare in giro o spostarti in questa zona?', opts:['spesso','qualche volta','mai']},
    {k:'C1b', t:'multi', q:'Perché?', showIf:a=>a.C1==='mai', opts:['non ho motivo','non mi va','non posso','non mi sento sicuro/a','altro'], other:true},
    {k:'C2', code:'C2', t:'multi', q:'Come ti sposti?', showIf:a=>a.C1&&a.C1!=='mai', opts:['a piedi','bici / monopattino','motorino','bus / tramvia','in auto con qualcuno']},
    {k:'C3', code:'C3', t:'single', q:'Quando prendi i mezzi, con chi sei?', showIf:a=>(a.C2||[]).includes('bus / tramvia'), opts:['sempre solo/a','quasi sempre solo/a','dipende','quasi sempre con altri','sempre con altri'], stack:true},
    {k:'C4', code:'C4', t:'map', night:true, q:'Ci sono fermate che eviti o dove non ti senti tranquillo/a?', showIf:a=>(a.C2||[]).includes('bus / tramvia'), hint:'Attiva la mappa, poi tocca la fermata (il layer fermate verrà aggiunto nella versione finale).', sheet:{title:'Una fermata che eviti', fields:[{k:'fermata',lbl:'Nome della fermata',t:'text'},{k:'perche',lbl:'Perché preferisci evitarla',t:'text'}]}},
    {k:'C5a', code:'C5', t:'map', night:true, q:'Ci sono posti in questa zona che eviti?', showIf:a=>a.C1&&a.C1!=='mai', hint:'Attiva la mappa, poi tocca un punto per aggiungere un luogo.', sheet:{title:'Un posto che eviti', fields:[{k:'tipo',lbl:'Che luogo è',t:'select',opts:LUOGHI},{k:'perche',lbl:'Perché preferisci evitarlo',t:'text'}]}},
    {k:'C5b', code:'C5', t:'map', night:true, q:'Ci sono posti in questa zona che eviteresti?', showIf:a=>a.C1==='mai', hint:'Attiva la mappa, poi tocca un punto per aggiungere un luogo.', sheet:{title:'Un posto che eviteresti', fields:[{k:'tipo',lbl:'Che luogo è',t:'select',opts:LUOGHI},{k:'perche',lbl:'Perché preferiresti evitarlo',t:'text'}]}},
    {k:'C6', code:'C6', t:'scale2', q:'In generale, quanto ti senti sicuro/a in questa zona…', rows:[{k:'C6_giorno',lbl:'…di giorno'},{k:'C6_buio',lbl:'…quando è buio'}], opts:['molto','abbastanza','poco','per nulla']},
   ]},
 { id:'D', title:'D · Domani', sub:'',
   items:[{k:'D1', code:'D1', t:'textarea', q:'Immagina questa zona tra 5 anni: cosa vorresti che ci fosse o che fosse diverso?'}]},
 { id:'E', title:'E · Due cose su di te', sub:'',
   items:[
    {k:'eta', t:'number', q:'Età'},
    {k:'genere', t:'single', q:'Genere', opts:['ragazza','ragazzo','altro / preferisco non dire']},
    {k:'vive', t:'single', q:'Vivi in questa zona (20–30 minuti a piedi)?', opts:['sì','in un’altra zona di Firenze','fuori Firenze']},
    {k:'giorno', t:'single', q:'Di giorno sei', opts:['a scuola','lavoro','formazione / altro','niente di questo'], followIf:'a scuola', follow:{k:'scuola_nome', t:'text', lbl:'Nome della tua scuola'}},
    {k:'attivita', t:'multi', q:'Partecipi a qualcuna di queste attività?', opts:['squadra o attività sportiva','scout','gruppo parrocchiale / religioso','musica, teatro, arte o altri laboratori','collettivo studentesco o politico','volontariato o associazione','altro','nessuna'], other:true},
   ]},
 { id:'fine', title:'Grazie!', sub:'', items:[{t:'end'}]},
];

/* ---------- invio dati ---------- */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzvc6nK2yR-ANIYD9yMgwBzTX_hqGYR_jEgXlgmQSb4NEvI9b7pHucqQW1ou7lp7MU1Fg/exec'; // URL della Web App Apps Script (vuoto = solo anteprima, nessun invio)
let sendState = null; // null | 'sending' | 'ok' | 'error'
function payloadFull(){ return { auto:{ consenso:!!t0, gps:gpsPos, inizio:t0?new Date(t0).toISOString():null, durata_s:t0?Math.floor((Date.now()-t0)/1000):0, ua:navigator.userAgent }, risposte:A }; }
async function send(){
  if(!ENDPOINT){ sendState=null; return; }
  sendState='sending'; renderSendState();
  try{ await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payloadFull())}); sendState='ok'; }
  catch(e){ sendState='error'; try{ const q=JSON.parse(localStorage.getItem('fc_queue')||'[]'); q.push(payloadFull()); localStorage.setItem('fc_queue',JSON.stringify(q)); }catch(_){} }
  renderSendState();
}
function renderSendState(){ const el=document.getElementById('sendstate'); if(!el) return;
  el.innerHTML = sendState==='sending'?'<span class="hint">Invio in corso…</span>'
    : sendState==='ok'?'<span class="hint" style="color:var(--ok)">✓ Risposte inviate.</span>'
    : sendState==='error'?'<span class="hint" style="color:var(--red)">Invio non riuscito: risposte salvate sul dispositivo. <button class="btn" id="retry" style="padding:6px 14px;font-size:13px">Riprova</button></span>' : ''; }

/* ---------- state ---------- */
const A = {}; let step = 0; let t0 = null; const maps = {}; let gpsPos = null;

/* ---------- auto data ---------- */
function tick(){ const d=new Date(); document.getElementById('clock').textContent=d.toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const s=t0?Math.floor((Date.now()-t0)/1000):0; document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
setInterval(tick,1000); tick();
function askGps(){
  if(!navigator.geolocation){ document.getElementById('gps').textContent='non supportato'; return; }
  navigator.geolocation.getCurrentPosition(p=>{ gpsPos=[p.coords.latitude,p.coords.longitude];
    document.getElementById('gps').textContent=gpsPos[0].toFixed(5)+', '+gpsPos[1].toFixed(5)+' (±'+Math.round(p.coords.accuracy)+' m)';
    document.getElementById('gpsdot').classList.add('on');
    Object.values(maps).forEach(m=>m.map.setView(gpsPos,15));
  }, ()=>{ document.getElementById('gps').textContent='non disponibile'; }, {enableHighAccuracy:true,timeout:10000});
}

/* ---------- render ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const v=document.getElementById('view');
  v.classList.add('fading');
  setTimeout(()=>{ renderNow(); v.classList.remove('fading'); },200);
}
function renderNow(){
  const sec=S[step]; const v=document.getElementById('view');
  document.body.classList.toggle('night',sec.id==='C');
  document.getElementById('prog').style.width=(step/(S.length-1)*100)+'%';
  document.getElementById('stepnum').textContent=step===0?'':(step+' / '+(S.length-1));
  let h=sec.title?`<h1 class="section-title">${esc(sec.title)}</h1><p class="section-sub">${esc(sec.sub)}</p>`:'';
  for(const it of sec.items) h+=card(it);
  v.innerHTML=h;
  for(const it of sec.items) if(it.t==='map') initMap(it);
  renderSendState();
  applyVisibility();
  document.getElementById('back').disabled=step===0;
  document.getElementById('back').classList.toggle('hidden',step===0);
  document.getElementById('next').textContent=step===0?'Iniziamo':(step===S.length-2?'Concludi':(step===S.length-1?'Nuova compilazione':'Avanti'));
  window.scrollTo({top:0});
}
function head(it){ return `<p class="q">${it.code?`<span class="code">${it.code}</span>`:''}${it.q}</p>${it.hint?`<p class="hint">${it.hint}</p>`:''}`; }
function chips(k,opts,multi,cls=''){ const cur=A[k]; return `<div class="chips ${cls}" data-k="${k}" data-multi="${multi?1:0}">`+opts.map(o=>`<span class="chip ${multi?(cur||[]).includes(o):cur===o?'on':''}" data-v="${esc(o)}">${esc(o)}</span>`).join('')+`</div>`; }
function photoHtml(k){ return `<div class="photo"><div class="thumb" id="th_${k}">${A[k+'_foto']?`<img src="${A[k+'_foto']}">`:'📷'}</div><div><label class="btn">Scatta foto<input type="file" accept="image/*" capture="environment" data-photo="${k}" hidden></label><div class="opt">facoltativa · non inquadrare persone</div></div></div>`; }
function card(it){
  let b='';
  switch(it.t){
    case 'intro': return `<div class="intro"><h1>Come vorresti il tuo quartiere?</h1>
      <p>Proviamo a farci questa domanda con <b>Fioriture Civiche</b>, un progetto che nei prossimi tre anni e mezzo lavorerà in quattro quartieri di Firenze per ripensarne alcuni luoghi e organizzare attività per ragazzi e ragazze:</p>
      <div class="zones"><span>Isolotto</span><span>San Jacopino</span><span>Cascine</span><span>Ugnano-Mantignano</span></div>
      <p>Lo portano avanti il Comune di Firenze e una rete di associazioni e cooperative del territorio, con il sostegno dell’impresa sociale Con i Bambini.</p>
      <p>Per capire come orientarci vogliamo partire proprio da voi, che questi luoghi li vivete ogni giorno. Le tue risposte andranno a formare una <b>mappa dei quartieri vista con gli occhi di ragazzi e ragazze</b>: uno strumento prezioso per chi progetterà spazi e attività, per fare scelte che partano da quello che vi piace di più e da quello che vorreste cambiare.</p>
      <p><span class="tag">⏱ circa 5 minuti</span><span class="tag">🔒 anonimo</span></p>
      <div class="consent"><p><b>Prima di iniziare.</b> Il questionario è pensato per essere compilato <b>nei luoghi che vivi</b> e che vorresti ripensare: per questo ti chiediamo di condividere la tua posizione (GPS), che ci serve a collegare le risposte al posto in cui ti trovi e a centrare le mappe. Se preferisci non condividerla, basta negare il permesso quando il telefono te lo chiede: puoi compilare il questionario lo stesso.</p>
      <p>Il questionario è anonimo: non ti chiediamo nome né contatti. Oltre alle risposte vengono registrate la data e l’ora e le eventuali foto che decidi di scattare. I dati servono solo alla ricerca di Fioriture Civiche e vengono usati in forma aggregata.</p>
      <p>Toccando <b>Iniziamo</b> confermi di aver letto l’<a href="privacy.html" target="_blank" rel="noopener">informativa sulla privacy</a> e accetti che le tue risposte vengano usate per la ricerca. Puoi interrompere quando vuoi.</p></div></div>`;
    case 'text': b=head(it)+`<input type="text" enterkeyhint="done" data-k="${it.k}" value="${esc(A[it.k])}">`; break;
    case 'number': b=head(it)+`<input type="number" inputmode="numeric" data-k="${it.k}" value="${esc(A[it.k])}" style="max-width:140px">`; break;
    case 'textarea': b=head(it)+`<textarea data-k="${it.k}" enterkeyhint="done">${esc(A[it.k])}</textarea>`; break;
    case 'textphoto': b=head(it)+`<textarea data-k="${it.k}" enterkeyhint="done" placeholder="Qualche parola…">${esc(A[it.k])}</textarea>`+photoHtml(it.k); break;
    case 'single': case 'multi':
      b=head(it)+chips(it.k,it.opts,it.t==='multi',it.stack?'radio':'');
      if(it.other) b+=`<div class="other ${otherOn(it)?'':'hidden'}" data-other="${it.k}"><input type="text" placeholder="Specifica…" data-k="${it.k}_altro" value="${esc(A[it.k+'_altro'])}"></div>`;
      if(it.follow) b+=`<div class="sub ${A[it.k]===it.followIf?'':'hidden'}" data-follow="${it.k}"><p class="lbl">${esc(it.follow.lbl)}</p><input type="${it.follow.t}" data-k="${it.follow.k}" value="${esc(A[it.follow.k])}" style="max-width:260px"></div>`;
      break;
    case 'scale2': b=head(it)+it.rows.map(r=>`<p class="lbl" style="margin-top:10px">${r.lbl}</p>`+chips(r.k,it.opts,false,'radio')).join(''); break;
    case 'map':
      b=head(it)+`<div class="map ${it.night?'night':''}" id="map_${it.k}"><div class="ph">Mappa non disponibile (serve connessione).</div></div>
        <div class="mapbar"><span><b>${(A[it.k]||[]).length}</b> luoghi segnati</span><span>${it.night?'🌙 vista notturna':''}</span></div>
        <div id="pins_${it.k}">${pinsHtml(it)}</div>`; break;
    case 'end':
      b=`<div class="done">🌸</div><p style="text-align:center">Grazie! Le tue risposte sono state registrate.</p><div id="sendstate" style="text-align:center;margin-bottom:10px"></div>
         <p class="hint" style="text-align:center">Anteprima dei dati raccolti (nel prototipo non vengono inviati).</p><pre>${esc(JSON.stringify(payload(),null,2))}</pre>
         <div style="text-align:center"><button class="btn" id="dl">Scarica JSON</button></div>`; break;
  }
  return `<div class="card" data-item="${it.k||''}">${b}</div>`;
}
function otherOn(it){ const v=A[it.k]; return it.t==='multi'?(v||[]).includes('altro'):v==='altro'; }
function pinsHtml(it){ return (A[it.k]||[]).map((p,i)=>`<div class="pin"><span class="n">${i+1}</span><div class="t">${esc(p.tipo||p.fermata||'luogo')}<small>${esc(p.perche||'—')}</small></div><button data-edit="${it.k}:${i}" title="Modifica">✎</button><button data-rm="${it.k}:${i}" title="Rimuovi">✕</button></div>`).join(''); }

function initMap(it){
  if(typeof L==='undefined') return;
  const el=document.getElementById('map_'+it.k); el.innerHTML='';
  const map=L.map(el,{zoomControl:true,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,tap:false}).setView(gpsPos||[43.7736,11.2135],14);
  const lock=document.createElement('div'); lock.className='maplock'; lock.innerHTML='<span>Tocca per usare la mappa</span>';
  const unlock=document.createElement('button'); unlock.className='mapunlock hidden'; unlock.textContent='✓ Fatto'; unlock.type='button';
  el.appendChild(lock); el.appendChild(unlock); L.DomEvent.disableClickPropagation(lock); L.DomEvent.disableClickPropagation(unlock);
  lock.addEventListener('click',()=>{ lock.classList.add('hidden'); unlock.classList.remove('hidden'); map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable(); if(map.tap) map.tap.enable(); });
  unlock.addEventListener('click',e=>{ e.stopPropagation(); unlock.classList.add('hidden'); lock.classList.remove('hidden'); map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable(); });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const m={map,markers:[]}; maps[it.k]=m;
  const icon=i=>L.divIcon({className:'',html:`<div class="marker-icon"><span>${i}</span></div>`,iconSize:[26,26],iconAnchor:[13,26]});
  m.draw=()=>{ m.markers.forEach(x=>map.removeLayer(x)); m.markers=(A[it.k]||[]).map((p,i)=>L.marker([p.lat,p.lng],{icon:icon(i+1)}).addTo(map).on('click',()=>openSheet(it,i))); document.getElementById('pins_'+it.k).innerHTML=pinsHtml(it); el.parentElement.querySelector('.mapbar b').textContent=(A[it.k]||[]).length; };
  if(gpsPos) L.circleMarker(gpsPos,{radius:7,color:it.night?'#fff':'#2F3E9E',fillColor:'#2F3E9E',fillOpacity:.9}).addTo(map);
  map.on('click',e=>{ A[it.k]=A[it.k]||[]; A[it.k].push({lat:e.latlng.lat,lng:e.latlng.lng}); m.draw(); openSheet(it,A[it.k].length-1,true); });
  m.draw(); setTimeout(()=>map.invalidateSize(),50);
}

/* pin sheet */
function openSheet(it,i,isNew){
  const p=A[it.k][i]; const sh=it.sheet;
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h3>${esc(sh.title)}</h3><p class="coords">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} · facoltativo</p>`+
    sh.fields.map(f=>`<p class="lbl">${esc(f.lbl)}</p>`+(f.t==='select'?`<select data-f="${f.k}"><option value="">—</option>${f.opts.map(o=>`<option ${p[f.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input type="text" data-f="${f.k}" value="${esc(p[f.k])}">`)+`<div style="height:10px"></div>`).join('')+
    `<div class="actions"><button class="btn ghost" data-act="del">${isNew?'Annulla':'Rimuovi'}</button><button class="btn primary" data-act="ok">Salva</button></div></div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg){ close(true); return; } const a=e.target.dataset.act; if(a==='ok') close(true); if(a==='del'){ A[it.k].splice(i,1); close(false); } });
  function close(save){ if(save) bg.querySelectorAll('[data-f]').forEach(x=>p[x.dataset.f]=x.value); bg.remove(); maps[it.k].draw(); }
  document.body.appendChild(bg);
}

function applyVisibility(){
  for(const it of S[step].items){ if(!it.showIf) continue; const el=document.querySelector(`[data-item="${it.k}"]`); const on=!!it.showIf(A); el.classList.toggle('hidden',!on); if(!on) delete A[it.k]; else if(it.t==='map'&&maps[it.k]) setTimeout(()=>maps[it.k].map.invalidateSize(),50); }
}

/* ---------- events ---------- */
document.getElementById('view').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ const g=c.parentElement, k=g.dataset.k, v=c.dataset.v;
    if(g.dataset.multi==='1'){ A[k]=A[k]||[]; const i=A[k].indexOf(v); i>=0?A[k].splice(i,1):A[k].push(v); c.classList.toggle('on'); }
    else { A[k]=A[k]===v?undefined:v; [...g.children].forEach(x=>x.classList.toggle('on',x.dataset.v===A[k])); }
    const it=S[step].items.find(i=>i.k===k);
    if(it){ const o=document.querySelector(`[data-other="${k}"]`); if(o) o.classList.toggle('hidden',!otherOn(it)); const f=document.querySelector(`[data-follow="${k}"]`); if(f) f.classList.toggle('hidden',A[k]!==it.followIf); }
    applyVisibility(); return; }
  const rm=e.target.closest('[data-rm]'); if(rm){ const [k,i]=rm.dataset.rm.split(':'); A[k].splice(+i,1); maps[k]?maps[k].draw():render(); return; }
  const ed=e.target.closest('[data-edit]'); if(ed){ const [k,i]=ed.dataset.edit.split(':'); openSheet(S[step].items.find(x=>x.k===k),+i); return; }
  if(e.target.id==='retry'){ send(); return; }
  if(e.target.id==='dl'){ const b=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='risposta_'+Date.now()+'.json'; a.click(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('textarea,input[type=text],input[type=number]')){ e.preventDefault(); e.target.blur(); } });
document.addEventListener('focusin',e=>{ if(e.target.matches('textarea,input')) setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250); });
document.getElementById('view').addEventListener('input',e=>{ const t=e.target; if(t.dataset.k) A[t.dataset.k]=t.value; });
document.getElementById('view').addEventListener('change',e=>{
  const t=e.target; if(t.dataset.photo&&t.files[0]){ const r=new FileReader(); r.onload=()=>{ A[t.dataset.photo+'_foto']=r.result; document.getElementById('th_'+t.dataset.photo).innerHTML=`<img src="${r.result}">`; }; r.readAsDataURL(t.files[0]); }
});
document.getElementById('next').onclick=()=>{
  if(step===S.length-1){ location.reload(); return; }
  if(step===0){ t0=Date.now(); askGps(); }
  step=Math.min(S.length-1,step+1); render();
  if(step===S.length-1) send(); };
document.getElementById('back').onclick=()=>{ step=Math.max(0,step-1); render(); };

function payload(){ return { auto:{ consenso:!!t0, gps:gpsPos, inizio:t0?new Date(t0).toISOString():null, durata_s:t0?Math.floor((Date.now()-t0)/1000):0 }, risposte:Object.fromEntries(Object.entries(A).map(([k,v])=>[k,(typeof v==='string'&&v.startsWith('data:image'))?'[foto allegata]':v])) }; }

render();
</script>
</body>
